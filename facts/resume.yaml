# The JD's six "What You'll Do" bullets, each answered with a thing that exists.
jd_map:
  - jd: Architect Multi-Agent Systems
    proof: >
      Designed the AitherOS dispatch ladder: a 33-agent roster (Demiurge codes,
      Hydra reviews, Athena audits, Apollo profiles, Prometheus deploys, Scribe
      documents) behind a single MCP gateway, with capability-based routing,
      swarm coding (11 parallel LLM agents), agent-to-agent mesh messaging
      (awrelay), and a ratchet loop (propose -> apply -> score -> keep/revert)
      driving measurable improvement. All LLM traffic routes through one
      priority scheduler (MicroScheduler) across a local RTX 5090, a DGX Spark
      pool and rented cloud GPUs.
  - jd: Implement Automated Governance
    proof: >
      Replaced manual review with 642 checker gates, each required to carry a
      --self-test proving it can still fail, each wired into one of four
      unattended lanes (CI, 4-hour in-fleet probe, host probe, self-test-only
      with a stated reason). A ledger rule forbids recording a mechanically
      detectable defect as a note: it must become a check. Stop hooks block a
      session that changed code without touching a gate or the ledger. A
      written "no false blockers" doctrine defines exactly three legitimate
      reasons an agent may stop (physically impossible, irreversible and
      destructive, owner said no) and measurably cut stalled loops.
  - jd: Engineer Context and Memory
    proof: >
      Built the semantic substrate agents work from: a code graph (awgraph,
      AST + tree-sitter call graphs, recall@25 measured), a repo-understanding
      layer (repowise), a portable scoped memory (awm), a knowledge graph with
      hybrid search (Nexus), a 25-question retrieval gold set with canaries
      that gate every chunking/embedding change, and a per-project doctrine
      file bind-mounted into every agent workspace. Trained a code-search
      embedder 13x smaller than its teacher that beats it, for $3 of GPU.
  - jd: Build Rigorous Evaluation Frameworks
    proof: >
      Every gate exits 0 / 1 / 2 (pass / violation / could-not-judge) and
      "could not judge" is never a pass. Built the gauntlet: capture ->
      change -> recapture -> blind A/B verdict -> raw-exit-code gate ->
      accept/reject with a rejected ledger. Caught a trainer that reported
      "3 epochs over 20,000 records" while touching 192 rows, an optimiser
      that had never run a round while logging "completed", and a mock-driven
      test suite that never executed the loop it tested. Bucketed metrics by
      seen/unseen so an aggregate at ceiling cannot hide a bucket at floor.
  - jd: Design Self-Healing Loops
    proof: >
      Autoheal + a death watchdog (opt-out) restart wedged services;
      a 4-hourly probe runs 79 live gates in-fleet and pages on VIOLATION and
      on DEAD separately; a data-writability gate auto-repairs non-sensitive
      permission drift and quarantines anything credential-shaped; a
      paging-path gate asserts the page itself LANDS by round-trip, after an
      outage where detection worked and the page died. Root-caused and
      documented the incidents (nine-hour WSL flap, thundering-herd boot
      storm, silent-empty SSE lanes) as gates, not memories.
  - jd: Prototype and Deploy
    proof: >
      Ship cadence: a new tenant app (backend, agent brain pack, portal,
      Cloudflare tunnel, GitHub Pages) in about ten minutes; three paying or
      pilot tenant appliances live (repair shop, game studio, political
      campaign tooling); 61 public repos; four packages on PyPI; an on-device
      1.7B model running in a Pixel 10 browser talking to the platform; a
      WebMCP design studio in the browser; and every blog post converted to a
      narrated video by the pipeline that made the one attached to this
      application.

